name: Profile summary cards

# 카드 SVG를 저장소에 직접 커밋합니다.
# 외부 Vercel 인스턴스에 의존하지 않으므로 rate limit으로 이미지가 깨지지 않습니다.
#
# 사전 준비:
#  1. Settings > Developer settings > Personal access tokens 에서 토큰 생성
#     (classic 기준 read:user, repo 스코프)
#  2. 이 저장소 Settings > Secrets and variables > Actions 에
#     SUMMARY_GITHUB_TOKEN 이라는 이름으로 등록

on:
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: gxuoo
          UTC_OFFSET: 9
